<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="grad-needle-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="grad-needle-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad-bg)" />

  <!-- Outer compass dial ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="8 12" stroke-opacity="0.5" />

  <!-- Compass Needle Points -->
  <g filter="url(#shadow)">
    <!-- North Orange Pointer -->
    <polygon points="256,110 286,256 256,236 226,256" fill="url(#grad-needle-top)" />
    <!-- South White Pointer -->
    <polygon points="256,402 286,256 256,276 226,256" fill="url(#grad-needle-bot)" />
    <!-- East Pointer -->
    <polygon points="402,256 256,226 276,256 256,286" fill="#38bdf8" fill-opacity="0.8" />
    <!-- West Pointer -->
    <polygon points="110,256 256,226 236,256 256,286" fill="#38bdf8" fill-opacity="0.8" />
    
    <!-- Central Dial Pivot -->
    <circle cx="256" cy="256" r="22" fill="#082f49" stroke="#ea580c" stroke-width="6" />
    <circle cx="256" cy="256" r="8" fill="#f8fafc" />
  </g>
</svg>
